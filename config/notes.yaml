# Per-app pre/post-install notes surfaced by bin/notes.sh.
# Schema per entry:
#   app:        matches brew formula/cask name, mas app name, or any identifier
#   phase:      prereq | post
#   severity:   required | optional | interactive
#   message:    multiline string shown to the user
#
# Severity colors in bin/notes.sh:
#   required    red     — must act, else the app is inert or broken
#   optional    yellow  — worth considering, not blocking
#   interactive yellow  — the app will prompt you on launch, just plan for it

notes:
  - app: mas
    phase: prereq
    severity: optional
    message: |
      Signing in to the Mac App Store (System Settings > Apple Account,
      or App Store > sign in) before the Brewfile runs avoids a
      mid-install interruption. If you skip this, mas will trigger a
      system login prompt when the first `mas "..."` entry runs; on
      fresh installs that prompt has been seen appearing off-screen,
      with no visible way to move it. Recovery if it happens:
        1. `killall storeagent` or `kill -9 $(pgrep storeagent)`
        2. Open App Store.app directly and sign in there
        3. Re-run this script

  - app: gnupg
    phase: post
    severity: required
    message: |
      For signed commits, restore ~/.gnupg from your previous machine over an
      encrypted channel (USB with FileVault, or scp direct).
      Verify with: gpg --list-secret-keys

  - app: aws-cli
    phase: post
    severity: required
    message: |
      Configure AWS access either by restoring ~/.aws/ (SSO config, credentials)
      from the previous machine, or by running `aws configure sso` fresh.

  - app: aws-vpn-client
    phase: post
    severity: required
    message: |
      AWS VPN Client needs a .ovpn-style profile from your platform team.
      - If migrating: restore ~/Library/Application Support/AWSVPNClient/ from
        the previous machine (admin privileges may be required for the sibling
        path /Library/Application Support/AWSVPNClient/).
      - If first-time access: request the profile, then import via
        File > Manage Profiles.

  - app: 1password
    phase: post
    severity: interactive
    message: |
      Sign in via "Sign in with SSO" on the welcome screen. Avoid the
      email+password path for company tenants.

  - app: jetbrains-toolbox
    phase: post
    severity: interactive
    message: |
      Launch Toolbox and sign into your JetBrains Account. Install IDEs
      (IntelliJ IDEA, PyCharm, etc.) manually through the Toolbox UI.
      JetBrains intentionally provides no CLI for this.

  - app: claude
    phase: post
    severity: required
    message: |
      Run your separate Claude Code backup/restore script to populate
      ~/.claude/ (CLAUDE.md, guidance, memory, settings).
      mac-setup does not manage ~/.claude/ state.

  - app: ssh
    phase: post
    severity: required
    message: |
      Restore ~/.ssh/ from your previous machine over an encrypted channel.
      Verify with: ssh -T git@github.com

  - app: gh
    phase: post
    severity: required
    message: |
      Authenticate the GitHub CLI so the gitconfig credential helper
      (!/opt/homebrew/bin/gh auth git-credential) works for HTTPS clones
      and pushes:
        gh auth login
      Add any additional accounts (work vs. personal) with:
        gh auth login --hostname github.com
      Switch between them later with: gh auth switch

  - app: gh-copilot
    phase: post
    severity: optional
    message: |
      If you use GitHub Copilot in the terminal, install the extension and
      authenticate:
        gh extension install github/gh-copilot
        gh copilot suggest "list files"   # triggers auth on first use
      Skip if you don't use Copilot CLI.

  - app: sops
    phase: post
    severity: required
    message: |
      Restore ~/.sops.yaml from your previous machine (or your password
      manager) so sops-encrypted files decrypt against the right KMS keys.
      Verify in a repo that uses sops: sops -d path/to/encrypted-file
      Without this file, every `sops -d` falls back to no creation_rules
      and will refuse.

  - app: cargo
    phase: post
    severity: optional
    message: |
      Rust itself is installed via mise. If you publish to crates.io, also
      restore ~/.cargo/credentials from your previous machine, or run
      `cargo login <token>` fresh. Only needed if you push crates.
