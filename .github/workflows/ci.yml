name: CI

on:
  push:
    branches: [main]
  pull_request:

# Workflow-level permissions stay minimal; each job that needs more
# grants its own in a job-scoped `permissions:` block.
permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint PR commits
        run: >-
          npx commitlint
          --from=${{ github.event.pull_request.base.sha }}
          --to=${{ github.event.pull_request.head.sha }}
          --verbose

  megalinter-ci:
    name: megalinter (documentation)
    runs-on: ubuntu-latest
    permissions:
      # contents: write — APPLY_FIXES in .mega-linter-ci.yml commits
      #                   auto-fixes back to the PR branch.
      # pull-requests: write — megalinter posts a summary PR comment.
      contents: write
      pull-requests: write
    steps:
      # Default persist-credentials:true is intentional: megalinter's
      # APPLY_FIXES pushes auto-fix commits back to the PR branch, which
      # needs the GitHub Actions token credential to persist.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # zizmor: ignore[artipacked] v4 — APPLY_FIXES needs persist-credentials
        with:
          fetch-depth: 0
      - name: MegaLinter
        # Pinned to v10 commit SHA (tag can be moved; SHA cannot).
        # Resolve current v10 with: gh api repos/oxsecurity/megalinter/git/refs/tags/v10
        # Documentation flavor chosen because it covers all five linters
        # in .mega-linter-ci.yml (shell / yaml / json / markdown / actions);
        # ci_light lacks markdownlint and actionlint.
        uses: oxsecurity/megalinter/flavors/documentation@9949bad031045f366be2467e00e8371a7328a2e2 # v10
        env:
          # GH_TOKEN is what zizmor reads to authenticate GitHub API
          # calls (e.g. tag lookups during its artipacked audit).
          # Without it, zizmor crashes with 401 Unauthorized.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEGALINTER_CONFIG: .mega-linter-ci.yml
          VALIDATE_ALL_CODEBASE: ${{ github.event_name != 'pull_request' }}

  megalinter-security:
    name: megalinter (security)
    runs-on: ubuntu-latest
    permissions:
      # Same rationale as megalinter-ci above.
      contents: write
      pull-requests: write
    steps:
      # Same rationale as megalinter-ci above.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # zizmor: ignore[artipacked] v4 — APPLY_FIXES needs persist-credentials
        with:
          fetch-depth: 0
      - name: MegaLinter
        # Pinned to v10 commit SHA (tag can be moved; SHA cannot).
        uses: oxsecurity/megalinter/flavors/security@9949bad031045f366be2467e00e8371a7328a2e2 # v10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEGALINTER_CONFIG: .mega-linter-security.yml
          VALIDATE_ALL_CODEBASE: ${{ github.event_name != 'pull_request' }}
